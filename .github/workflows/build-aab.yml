name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "Using www"

      - name: Add Android Platform
        run: |
          rm -rf android || true
          npx cap add android
          ls -la android/

      - name: Copy web to Android
        run: npx cap copy android

      - name: FORCE minSdk 24 and AD_ID - FINAL FIX
        run: |
          echo "=== BEFORE ==="
          cat android/variables.gradle
          # ONLY change minSdk, don't overwrite whole file
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
          echo "=== AFTER ==="
          cat android/variables.gradle
          chmod +x ./fix-ad-id.sh || true
          ./fix-ad-id.sh || true
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            grep -q "AD_ID" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "storeFile=release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

      - name: Build AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
