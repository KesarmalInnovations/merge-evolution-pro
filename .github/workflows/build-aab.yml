name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: npm ci || npm install
      - run: npm run build || echo "No build"
      - run: npx cap add android || true
      - run: npx cap copy android
      - name: Fix AD_ID and minSdk 24
        run: |
          chmod +x ./fix-ad-id.sh || true
          ./fix-ad-id.sh || true
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/22/24/g' android/variables.gradle || true
          sed -i 's/minSdkVersion 22/minSdkVersion 24/g' android/app/build.gradle || true
      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "storeFile=release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-ADS-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
