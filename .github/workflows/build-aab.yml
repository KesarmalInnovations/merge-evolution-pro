name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Restore if package.json missing
        run: |
          set -x
          ls -la
          if [ -f "package.json" ]; then
            echo "package.json mil gaya"
          else
            echo "package.json missing hai, history se dhoondh raha hu..."
            git log --oneline --all -30
            GOOD=""
            for C in $(git rev-list --all | head -100); do
              if git ls-tree -r --name-only $C | grep -qx "package.json"; then
                GOOD=$C
                echo "Good commit mila: $GOOD"
                break
              fi
            done
            echo "Restoring from $GOOD"
            cp .github/workflows/build-aab.yml /tmp/build-aab.yml
            git checkout $GOOD -- .
            cp /tmp/build-aab.yml .github/workflows/build-aab.yml
            ls -la
            cat package.json | head -20
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Signed AAB
        run: |
          rm -rf android
          npm install
          npx cap add android
          npx cap copy android
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          cp android/key.properties android/app/key.properties
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload SIGNED AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-SIGNED-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
