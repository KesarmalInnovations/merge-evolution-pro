name: Build Merge Evolution PRO AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore or Create Keystore
        run: |
          # Agar pehle se keystore repo me hai toh use karo, nahi toh naya banao
          if [ -f "android/app/release.keystore" ]; then
            echo "Old keystore found, reusing!"
          else
            echo "No keystore found, will create new one in build step"
          fi
      - name: Create Game
        run: |
          cat > package.json << 'EOF'
          {"name":"merge-evolution-pro","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/android":"^6.2.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {"appId":"com.mergeevolution.dragons","appName":"Merge Evolution PRO","webDir":"www","bundledWebRuntime":false}
          EOF
          mkdir -p www
          echo '<html><body style="background:#111;color:#0f8;text-align:center;padding:50px;font-family:sans-serif"><h1>Merge Evolution PRO</h1><p>Final Locked Key Build</p></body></html>' > www/index.html
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build AAB with LOCKED Keystore
        run: |
          npm install
          npx cap add android || true
          npx cap sync android
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          cd android
          # Agar keystore pehle se nahi hai tabhi naya banao - warna wahi purana use hoga
          if [ ! -f "app/release.keystore" ]; then
            keytool -genkey -v -keystore app/release.keystore -alias mergeevolution -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Merge, OU=Game, O=Kesarmal, L=Delhi, S=Delhi, C=IN"
          fi
          # Certificate export for Google Play reset
          keytool -export -rfc -keystore app/release.keystore -alias mergeevolution -storepass 123456 -file upload_certificate.pem
          cat upload_certificate.pem
          # Patch build.gradle
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("app/build.gradle")
          s=p.read_text()
          if "signingConfigs" not in s:
              s=s.replace("buildTypes {", 'signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "123456"\n            keyAlias "mergeevolution"\n            keyPassword "123456"\n        }\n    }\n    buildTypes {')
          s=s.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew bundleRelease
          ls -lh app/build/outputs/bundle/release/
          cp app/release.keystore ../release.keystore || true
          cp upload_certificate.pem ../upload_certificate.pem || true
      - uses: actions/upload-artifact@v4
        with:
          name: merge-evolution-pro-aab-and-key
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/release.keystore
            android/app/upload_certificate.pem
