name: FINAL FIX - Persistent Keystore v3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Game - Real ZEROED
        run: |
          cat > package.json << 'EOF'
          {"name":"merge-evolution-pro","version":"1.1.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/android":"^6.2.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.kesarmalinnovations.mergeevolution",
            "appName": "Merge Evolution PRO",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          ls -lh www/
          echo "Real game check - index.html size:"
          wc -c www/index.html

      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Keystore - PERSISTENT AT ROOT
        run: |
          # Keystore ko root pe rakhenge taaki android delete hone pe bhi bache
          if [ -f "release.keystore" ]; then
            echo "Found existing keystore at root, reusing"
          else
            echo "Creating new persistent keystore at root"
            keytool -genkey -v -keystore release.keystore -alias kesarmal -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=KesarmalInnovations, OU=Games, O=KesarmalInnovations, L=Delhi, S=Delhi, C=IN"
          fi
          # Certificate for Play Console reset
          keytool -export -rfc -keystore release.keystore -alias kesarmal -storepass 123456 -file upload_certificate.pem
          keytool -list -v -keystore release.keystore -alias kesarmal -storepass 123456 | grep -E "SHA1|SHA256"
          ls -lh release.keystore upload_certificate.pem

      - name: Build AAB - Clean Android First
        run: |
          # Purana android folder hata do - isiliye error aa raha tha
          rm -rf android
          npm install
          npx cap add android
          npx cap sync android
          # Ab root wala keystore android me copy karo
          cp release.keystore android/app/release.keystore
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          sed -i 's/versionCode .*/versionCode 4/' android/app/build.gradle || true
          sed -i 's/versionName .*/versionName "1.3"/' android/app/build.gradle || true
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          if "signingConfigs" not in s:
              s=s.replace("buildTypes {", 'signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "123456"\n            keyAlias "kesarmal"\n            keyPassword "123456"\n        }\n    }\n    buildTypes {')
          s=s.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          p.write_text(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          echo "=== AAB READY ==="
          ls -lh app/build/outputs/bundle/release/

      - name: Upload AAB and Certificate
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-FIXED-AAB-v1.3
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            upload_certificate.pem
            release.keystore
