name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            cp release.keystore android/app/upload-keystore.jks || true
          fi

      - name: Fix Kotlin Duplicate Class Error
        run: |
          echo "Fixing kotlin version conflict..."
          # 1. Force kotlin 1.8.22 in android/build.gradle
          if [ -f "android/build.gradle" ]; then
            sed -i "s/.*kotlin_version.*=.*'.*'/    ext.kotlin_version = '1.8.22'/" android/build.gradle || true
            sed -i "s/.*kotlin_version.*=.*\".*\".*/    ext.kotlin_version = '1.8.22'/" android/build.gradle || true
          fi
          
          # 2. Add resolutionStrategy to force same version
          for f in android/build.gradle android/app/build.gradle; do
            if [ -f "$f" ]; then
              if ! grep -q "resolutionStrategy" "$f"; then
                echo "" >> "$f"
                echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> "$f"
              fi
            fi
          done
          
          # 3. Clean
          rm -rf ~/.gradle/caches || true

      - name: Build AAB V8
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon -x test

      - name: Find AAB
        run: find . -name "*.aab" -type f

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8
          path: |
            **/*.aab
