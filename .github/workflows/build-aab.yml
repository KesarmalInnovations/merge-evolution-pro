name: Build Signed AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build AAB with ORIGINAL key
        run: |
          npm ci || npm install
          npm run build || true
          rm -rf android
          npx cap add android
          npx cap copy android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          NEW_CODE=$(date +%s)
          echo "Bumping to $NEW_CODE"
          sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.$NEW_CODE\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          ls -lh release.keystore
          cd android
          chmod +x gradlew
         ./gradlew clean bundleRelease
          cd..
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          ls -lh $AAB
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} $AAB ${{ secrets.KEY_ALIAS }}
          jarsigner -verify $AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-AAB-SIGNED
          path: android/app/build/outputs/bundle/release/*.aab
