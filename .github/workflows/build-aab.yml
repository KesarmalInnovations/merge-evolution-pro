name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "Using www"

      - name: Add Android Platform
        run: |
          # Clean and add fresh
          rm -rf android || true
          npx cap add android || true
          ls -la android/ || true

      - name: Copy web to Android
        run: npx cap copy android || npx cap sync android || true

      - name: FORCE minSdk 24 and AD_ID
        run: |
          echo "=== Fixing minSdk 24 ==="
          cat > android/variables.gradle << 'EOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxAppCompatVersion = '1.6.1'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              junitVersion = '4.13.2'
              androidxMaterialVersion = '1.11.0'
              androidxBrowserVersion = '1.8.0'
              androidxExifInterfaceVersion = '1.3.6'
              coreSplashScreenVersion = '1.0.1'
          }
          EOF
          cat android/variables.gradle
          chmod +x ./fix-ad-id.sh || true
          ./fix-ad-id.sh || true
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            grep -q "AD_ID" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "storeFile=release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

      - name: Build AAB - FIXED FOR GRADLEW
        run: |
          echo "Checking for gradlew..."
          ls -la android/ | grep gradlew || true
          # If gradlew missing, restore
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew missing, reinstalling android platform..."
            rm -rf android
            npx cap add android
            npx cap copy android
          fi
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
