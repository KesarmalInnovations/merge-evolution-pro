name: FINAL FIXED V3 - API 36 - Version 6 - Keystore Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Game - API 36 Version 6
        run: |
          echo "PACKAGE: com.kesarmalinnovations.mergeevolutionpro - API 36 - V6 FIX V3"
          cat > package.json << 'EOF'
          {"name":"merge-evolution-pro","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/android":"^6.2.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.kesarmalinnovations.mergeevolutionpro",
            "appName": "Merge Evolution PRO",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          ls -lh www/

      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build AAB - API 36 + V6 + Keystore FIX V3
        run: |
          npm install
          npx cap add android
          npx cap sync android
          
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/versionCode .*/versionCode 6/' android/app/build.gradle || true
          sed -i 's/versionName .*/versionName "1.0.0"/' android/app/build.gradle || true
          
          cd android
          
          mkdir -p app
          mkdir -p app/app
          
          # Keystore fix - no self-copy
          if [ -f "../release.keystore" ]; then
            echo "Found existing keystore at root"
            cp ../release.keystore app/release.keystore || true
            cp ../release.keystore app/app/release.keystore || true
          elif [ -f "app/release.keystore" ]; then
            echo "Found keystore in app folder"
            cp app/release.keystore app/app/release.keystore || true
            cp app/release.keystore ../release.keystore || true
          else
            echo "Creating NEW keystore"
            keytool -genkey -v -keystore app/release.keystore -alias kesarmal -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=KesarmalInnovations, OU=Games, O=KesarmalInnovations, L=Delhi, S=Delhi, C=IN"
            cp app/release.keystore app/app/release.keystore || true
            cp app/release.keystore ../release.keystore || true
          fi
          
          ls -lh app/release.keystore
          ls -lh app/app/release.keystore || echo "app/app not needed"
          ls -lh ../release.keystore
          
          # Build with absolute path
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore -Pandroid.injected.signing.store.password=123456 -Pandroid.injected.signing.key.alias=kesarmal -Pandroid.injected.signing.key.password=123456
          
          ls -lh app/build/outputs/bundle/release/
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-REAL-GAME-AAB-VERSION-6-API36-FIXED-V3
          path: android/app/build/outputs/bundle/release/*.aab
