name: FINAL V10 - API 36 - Version 10 - Closed Testing
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true
      - name: Build AAB - API 36 V10 FINAL LOCKED
        run: |
          npm install
          npx cap add android
          npx cap sync android
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/versionCode .*/versionCode 10/' android/app/build.gradle || true
          sed -i 's/versionName .*/versionName "1.0.10"/' android/app/build.gradle || true
          cd android
          mkdir -p app/app
          cp ../release.keystore app/release.keystore || true
          cp ../release.keystore app/app/release.keystore || true
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore -Pandroid.injected.signing.store.password=123456 -Pandroid.injected.signing.key.alias=kesarmal -Pandroid.injected.signing.key.password=123456
      - name: Upload AAB V10
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-LOCKED-V10-API36-AAB-CLOSED-TESTING
          path: android/app/build/outputs/bundle/release/*.aab
