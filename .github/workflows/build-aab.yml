name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-Heal Missing Files
        run: |
          if [ ! -f "package.json" ]; then
            echo "Restoring..."
            curl -L -o package.json https://raw.githubusercontent.com/KesarmallInnovations/merge-evolution-pro/3a024e8/package.json
            curl -L -o capacitor.config.json https://raw.githubusercontent.com/KesarmallInnovations/merge-evolution-pro/3a024e8/capacitor.config.json || true
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Signed AAB
        run: |
          npm install
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Merge Evolution PRO" com.kesarmalinnovations.mergeevolutionpro --web-dir=www --npm-client npm
          fi
          node -e "let fs=require('fs');let f='capacitor.config.json';if(fs.existsSync(f)){let j=JSON.parse(fs.readFileSync(f));j.appId='com.kesarmalinnovations.mergeevolutionpro';j.appName='Merge Evolution PRO';j.webDir='www';fs.writeFileSync(f,JSON.stringify(j,null,2))}"
          rm -rf android
          npx cap add android
          npx cap copy android
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          cp android/key.properties android/app/key.properties
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-SIGNED-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
