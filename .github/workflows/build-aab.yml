name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Project + Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            cp release.keystore android/app/upload-keystore.jks || true
          fi
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Merge Evolution PRO" com.kesarmalinnovations.mergeevolutionpro --web-dir=www
            npx cap add android
            mkdir -p android/app
            cp release.keystore android/app/upload-keystore.jks || true
          fi
          chmod +x android/gradlew

      - name: Build AAB V8
        run: |
          cd android
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8
          path: |
            **/*.aab
