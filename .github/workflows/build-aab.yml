name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { java-version: 17, distribution: temurin }

      - name: Build AAB + MANUAL SIGN
        run: |
          rm -rf android
          npm ci || npm install
          npm run build || true
          npx cap add android
          npx cap copy android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          keytool -genkey -v -keystore android/app/release.keystore -alias merge -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Merge, O=Kesarmall, L=Manesar, ST=Haryana, C=IN"
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-build-cache --rerun-tasks
          echo "--- Unsigned AAB built, now signing manually ---"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/release.keystore -storepass android123 -keypass android123 app/build/outputs/bundle/release/app-release.aab merge
          echo "--- VERIFY ---"
          jarsigner -verify -verbose app/build/outputs/bundle/release/app-release.aab | head -20
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -E "BUNDLE.SF|MERGE.SF|META-INF/MANIFEST"
          echo "✅ SIGNED BY JARSIGNER"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-MANUAL-FINAL
          path: android/app/build/outputs/bundle/release/*.aab
