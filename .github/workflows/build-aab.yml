name: Merge Evolution PRO - V8 Closed Testing API 36

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Fix AD_ID Permission for Ads (V7 Fix)
        run: |
          if ! grep -q "com.google.android.gms.permission.AD_ID" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' android/app/src/main/AndroidManifest.xml
          fi
          cat android/app/src/main/AndroidManifest.xml | grep AD_ID

      - name: Pub Get
        run: flutter pub get

      - name: Build AAB - V8 (1.0.2) API 36
        run: flutter build appbundle --release --build-number=8 --build-name=1.0.2

      - name: Upload AAB V8
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8-API36-Closed
          path: build/app/outputs/bundle/release/app-release.aab
