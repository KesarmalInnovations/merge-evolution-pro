name: FINAL V11.10 - ADS + API36 FIXED

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Setup SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Create keystore.properties
        run: |
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Patch API36 + V14 + AD_ID + Signing
        run: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle").read_text()
          p = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', p)
          p = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', p)
          p = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', p)
          p = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', p)
          p = re.sub(r'versionCode\s+\d+', 'versionCode 14', p)
          p = re.sub(r'versionName\s+".*?"', 'versionName "1.0.14"', p)
          if "signingConfigs" not in p:
              p = p.replace("android {", 'def keystorePropertiesFile = rootProject.file("app/keystore.properties")\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) {\n keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {\n signingConfigs {\n release {\n storeFile file(keystoreProperties["storeFile"] ?: "release.keystore")\n storePassword keystoreProperties["storePassword"]\n keyAlias keystoreProperties["keyAlias"]\n keyPassword keystoreProperties["keyPassword"]\n }\n }', 1)
          if "signingConfig signingConfigs.release" not in p:
              p = p.replace("release {", "release {\n signingConfig signingConfigs.release", 1)
          pathlib.Path("android/app/build.gradle").write_text(p)
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml").read_text()
          if "AD_ID" not in m:
              m = m.replace("<application", '<uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n <application')
              pathlib.Path("android/app/src/main/AndroidManifest.xml").write_text(m)
          print("Patched done")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build SIGNED AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-ADS-API36-V14-FIXED
          path: android/app/build/outputs/bundle/release/app-release.aab
