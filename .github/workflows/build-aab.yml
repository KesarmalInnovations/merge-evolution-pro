name: FINAL V11.9 - ADS + API36 + SIGNED

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install

      - name: Add Android platform
        run: |
          if [! -d "android" ]; then
            npx cap add android
          fi

      - name: Setup SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create keystore.properties
        run: |
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Patch API36 + Version14 + ADS Permission + Signing
        run: |
          python3 << 'PY'
          import pathlib, re

          # 1. build.gradle
          p = pathlib.Path("android/app/build.gradle").read_text()
          p = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', p)
          p = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', p)
          p = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', p)
          p = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', p)
          p = re.sub(r'versionCode\s+\d+', 'versionCode 14', p)
          p = re.sub(r'versionName\s+".*?"', 'versionName "1.0.14"', p)

          if "signingConfigs" not in p:
              p = p.replace("android {", '''
          def keystorePropertiesFile = rootProject.file("app/keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile']?: 'release.keystore')
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          ''', 1)
              p = p.replace("buildTypes {\n release {", "buildTypes {\n release {\n signingConfig signingConfigs.release")

          pathlib.Path("android/app/build.gradle").write_text(p)

          # 2. AndroidManifest.xml - AD_ID permission add
          mpath = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          mp = mpath.read_text()
          if "com.google.android.gms.permission.AD_ID" not in mp:
              mp = mp.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"\n', 1) if "xmlns:tools" not in mp else mp
              mp = mp.replace("</manifest>", ' <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n</manifest>')
              # application tag ke just upar bhi daal de safe side
              if '<application' in mp and 'AD_ID' not in mp.split('<application')[0]:
                 mp = mp.replace("<application", ' <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n <application')
          mpath.write_text(mp)
          print("Patched AD_ID permission + API36 + v14")

          # 3. variables.gradle
          vpath = pathlib.Path("android/variables.gradle")
          if vpath.exists():
              vp = vpath.read_text()
              vp = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', vp)
              vp = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', vp)
              vpath.write_text(vp)
          PY

      - run: npx cap sync android

      - name: Build SIGNED AAB - ADS + API36
        working-directory: android
        run: |
          chmod +x gradlew
         ./gradlew bundleRelease --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-ADS-API36-V14
          path: android/app/build/outputs/bundle/release/app-release.aab
