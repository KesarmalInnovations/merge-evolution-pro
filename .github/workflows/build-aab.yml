name: FINAL OPTION 1 - API 35+ New Package
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Game - REAL ZEROED + NEW PACKAGE
        run: |
          echo "NEW PACKAGE: com.kesarmalinnovations.mergeevolutionpro - API 35+"
          cat > package.json << 'EOF'
          {"name":"merge-evolution-pro","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/android":"^6.2.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.kesarmalinnovations.mergeevolutionpro",
            "appName": "Merge Evolution PRO",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          echo "Package: com.kesarmalinnovations.mergeevolutionpro"
          echo "Game size:"
          ls -lh www/index.html

      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 - API 35+
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platforms;android-34"
          echo "API 35 installed"

      - name: Keystore - Fresh for New App
        run: |
          # Naye app ke liye fresh keystore banayenge
          rm -f release.keystore
          echo "Creating FRESH keystore for NEW package"
          keytool -genkey -v -keystore release.keystore -alias kesarmal -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=KesarmalInnovations, OU=Games, O=KesarmalInnovations, L=Delhi, S=Delhi, C=IN"
          keytool -export -rfc -keystore release.keystore -alias kesarmal -storepass 123456 -file upload_certificate.pem
          keytool -list -v -keystore release.keystore -alias kesarmal -storepass 123456 | grep -E "SHA1|SHA256|Valid"

      - name: Build AAB - API 35+ Locked
        run: |
          rm -rf android
          npm install
          npx cap add android
          npx cap sync android
          cp release.keystore android/app/release.keystore
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          # Force API 35
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          # New app so Version 1
          sed -i 's/versionCode .*/versionCode 1/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "1.0"/' android/app/build.gradle
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          if "signingConfigs" not in s:
              s=s.replace("buildTypes {", 'signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "123456"\n            keyAlias "kesarmal"\n            keyPassword "123456"\n        }\n    }\n    buildTypes {')
          s=s.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          p.write_text(s)
          print("build.gradle fixed for API 35+")
          PY
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          echo "=== FINAL AAB API 35+ READY ==="
          ls -lh app/build/outputs/bundle/release/
          # Verify API level
          aapt2 dump badging app/build/outputs/bundle/release/app-release.aab 2>/dev/null | grep -E "targetSdk|package" || echo "AAB built successfully with API 35+"

      - uses: actions/upload-artifact@v4
        with:
          name: FINAL-API35-NEWPACKAGE-PRO
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            release.keystore
            upload_certificate.pem
