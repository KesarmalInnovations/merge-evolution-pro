name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name "package.json"

      - name: Fresh Build
        run: |
          rm -rf android
          ls -la
          if [ ! -f "package.json" ]; then echo "package.json root pe nahi hai, dhoondh raha hu..." && ROOT=$(find . -name "package.json" -type f | head -n1 | xargs dirname) && cd $ROOT && pwd && ls -la; fi
          npm install
          npx cap add android
          npx cap copy android
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          cp android/key.properties android/app/key.properties
          sed -i "s/.*kotlin_version.*/    ext.kotlin_version = '1.8.22'/" android/build.gradle || true
          cat >> android/app/build.gradle << 'EOF'
          configurations.all {
              resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' }
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF
          chmod +x android/gradlew

      - name: Build Signed AAB
        run: |
          cd android
          ./gradlew clean bundleRelease --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-SIGNED-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
