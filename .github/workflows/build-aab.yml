name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            cp release.keystore android/app/upload-keystore.jks
          fi

      - name: Build - Auto Detect
        run: |
          ls -la
          echo "--- checking project type ---"
          if [ -f "pubspec.yaml" ]; then
            echo "Flutter found"
            flutter pub get
            flutter build appbundle --release --build-number=8 --build-name=1.0.2
          elif [ -f "package.json" ]; then
            echo "NPM/Capacitor found"
            npm install
            npx cap sync || true
            if [ -d "android" ]; then
              cd android && chmod +x gradlew && ./gradlew bundleRelease
            fi
          elif [ -d "android" ]; then
            echo "Android folder found"
            cd android && chmod +x gradlew && ./gradlew bundleRelease
          else
            echo "No Flutter/No NPM - checking www"
            ls -la www
          fi

      - name: Find AAB
        run: find . -name "*.aab" -type f -ls

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8
          path: |
            **/*.aab
          if-no-files-found: warn
