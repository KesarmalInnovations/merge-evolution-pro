name: Build AAB API 36

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build AAB with API 36
        run: |
          cordova create app com.kesarmal.mergeevolutionpro "Merge Evolution PRO"
          cp -r www/* app/www/
          cp release.keystore app/ || true
          cd app
          cordova platform add android@13.0.0
          
          echo "Fixing to API 36..."
          # compileSdk aur targetSdk ko 36 pe force
          sed -i 's/compileSdkVersion.*/    compileSdkVersion 36/' platforms/android/app/build.gradle
          sed -i 's/targetSdkVersion.*/    targetSdkVersion 36/' platforms/android/app/build.gradle
          sed -i 's/compileSdk 34/compileSdk 36/g; s/compileSdk 33/compileSdk 36/g; s/compileSdk 35/compileSdk 36/g' platforms/android/app/build.gradle
          sed -i 's/targetSdk 34/targetSdk 36/g; s/targetSdk 33/targetSdk 36/g; s/targetSdk 35/targetSdk 36/g' platforms/android/app/build.gradle
          sed -i 's/versionCode .*/versionCode 3/' platforms/android/app/build.gradle || true
          
          # Build bundle
          cordova build android --release -- --packageType=bundle

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-api36
          path: app/platforms/android/app/build/outputs/bundle/release/*.aab
