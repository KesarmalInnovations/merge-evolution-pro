name: FINAL V11.15 - REAL AD_ID + SIGNED FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - run: npm install
      - run: if [ ! -d "android" ]; then npx cap add android; fi

      - name: Setup SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Keystore props
        run: |
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Patch Version + Signing
        run: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle").read_text()
          p = re.sub(r'versionCode\s+\d+', 'versionCode 18', p)
          p = re.sub(r'versionName\s+".*?"', 'versionName "1.0.18"', p)
          if "keystorePropertiesFile" not in p:
              p = p.replace("android {", 'def keystorePropertiesFile = rootProject.file("app/keystore.properties")\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {', 1)
          if "signingConfigs" not in p:
              p = p.replace("android {", 'android {\n    signingConfigs {\n        release {\n            storeFile file(keystoreProperties[\'storeFile\'])\n            storePassword keystoreProperties[\'storePassword\']\n            keyAlias keystoreProperties[\'keyAlias\']\n            keyPassword keystoreProperties[\'keyPassword\']\n        }\n    }', 1)
          if "signingConfig signingConfigs.release" not in p:
              p = re.sub(r'buildTypes\s*{\s*release\s*{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', p, count=1)
          pathlib.Path("android/app/build.gradle").write_text(p)
          v = pathlib.Path("android/variables.gradle")
          vt = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', v.read_text())
          vt = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', vt)
          v.write_text(vt)
          PY

      - name: Sync + FORCE AD_ID
        run: |
          npx cap sync android
          # FORCE INSERT AFTER SYNC - 2 jagah daalenge
          python3 << 'PY'
          import pathlib
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = m.read_text()
          if "AD_ID" not in t:
              t = t.replace("<application", '<uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <application')
              m.write_text(t)
          t = m.read_text()
          if t.count("AD_ID") < 1:
              t = t.replace("</manifest>", '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n</manifest>')
              m.write_text(t)
          print(m.read_text())
          PY
          echo "=== CHECK AD_ID ===" && grep -c AD_ID android/app/src/main/AndroidManifest.xml

      - name: Build AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V18-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
