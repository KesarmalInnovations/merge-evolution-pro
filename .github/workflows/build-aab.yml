name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { java-version: 17, distribution: temurin }

      - name: Build with ORIGINAL keystore
        run: |
          npm ci || npm install
          npm run build || true
          rm -rf android
          npx cap add android
          npx cap copy android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          echo "=== Original keystore check ==="
          ls -lh release.keystore
          KS_PATH="$(pwd)/release.keystore"
          echo "Using: $KS_PATH"
          # Try to list with secrets first
          keytool -list -v -keystore release.keystore -storepass ${{ secrets.KEYSTORE_PASSWORD }} -alias ${{ secrets.KEY_ALIAS }} 2>&1 | head -20 || keytool -list -v -keystore release.keystore -storepass android123 2>&1 | head -20
          cp release.keystore android/app/release.keystore
          cp release.keystore android/release.keystore
          # Create properties with ABSOLUTE path and your secrets
          cat > android/keystore.properties <<EOF
          storeFile=$KS_PATH
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cat android/keystore.properties
          cat > android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-build-cache --rerun-tasks
          echo "=== FINAL VERIFY ==="
          jarsigner -verify -verbose app/build/outputs/bundle/release/app-release.aab | head -20

      - name: Upload SIGNED AAB
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-SIGNED-ORIGINAL-KEY
          path: android/app/build/outputs/bundle/release/*.aab
