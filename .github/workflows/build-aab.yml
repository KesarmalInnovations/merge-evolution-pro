name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { java-version: 17, distribution: temurin }

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || npx cap copy android || true

      - name: Build Signed AAB - CACHE CLEAN FIX
        run: |
          rm -rf android ~/.gradle
          npx cap add android
          npx cap copy android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          echo "Creating new keystore..."
          keytool -genkey -v -keystore android/app/release.keystore -alias merge -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Merge PRO, O=Kesarmall, L=Manesar, ST=Haryana, C=IN"
          cp android/app/release.keystore android/release.keystore
          # BOTH properties files - yehi miss ho raha tha
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=android123
          keyAlias=merge
          keyPassword=android123
          EOF
          cat > android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=android123
          keyAlias=merge
          keyPassword=android123
          EOF
          cat android/keystore.properties
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease --no-build-cache --rerun-tasks
          echo "--- VERIFY ---"
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep META-INF
          ls -lh app/build/outputs/bundle/release/

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-FINAL-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
