name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "Using www"

      - name: Add Android if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android || true

      - name: FORCE minSdk 24
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
          cat android/variables.gradle

      - name: Setup Keystore - USING YOUR COMMITTED KEYSTORE
        run: |
          echo "Using release.keystore from repo root (your old working method)"
          ls -lh release.keystore || echo "No root keystore"
          # Copy your committed keystore to app folder
          cp release.keystore android/app/release.keystore || true
          cp release.keystore android/release.keystore || true
          # Also decode from secret as backup
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/decoded.keystore || true
          if [ -s /tmp/decoded.keystore ]; then
            cp /tmp/decoded.keystore android/app/release.keystore
            cp /tmp/decoded.keystore android/release.keystore
          fi
          ls -lh android/app/release.keystore
          # Create properties
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties
          echo "storeFile=app/release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties
          cat android/app/keystore.properties | grep -v Password

      - name: Build Signed AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease
          ls -lh app/build/outputs/bundle/release/

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
