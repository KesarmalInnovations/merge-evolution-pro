name: Build AAB API 36

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager --list | grep 36 || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build AAB with API 36
        run: |
          cordova create app com.kesarmal.mergeevolutionpro "Merge Evolution PRO"
          cp -r www/* app/www/
          cp release.keystore app/
          cd app
          cordova platform add android@13.0.0
          
          # FIX API 36 - main fix
          echo "Forcing API 36..."
          find platforms/android -name "build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} \; || true
          find platforms/android -name "build.gradle" -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' {} \; || true
          find platforms/android -name "build.gradle" -exec sed -i 's/compileSdk 3./compileSdk 36/g' {} \; || true
          find platforms/android -name "build.gradle" -exec sed -i 's/targetSdk 3./targetSdk 36/g' {} \; || true
          
          # versionCode 2 -> 3
          sed -i 's/versionCode.*/versionCode 3/g' platforms/android/app/build.gradle || true
          
          echo '<preference name="android-targetSdkVersion" value="36" />' >> config.xml
          
          cordova build android --release -- --packageType=bundle

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-api36
          path: app/platforms/android/app/build/outputs/bundle/release/*.aab
