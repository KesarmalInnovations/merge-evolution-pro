name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "Using www"

      - name: Recreate Android Fresh
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: FORCE minSdk 24
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true

      - name: CREATE NEW KEYSTORE - 100% Signed Guaranteed
        run: |
          echo "Creating fresh keystore that will be signed..."
          # Delete old corrupted keystore
          rm -f release.keystore android/app/release.keystore android/release.keystore
          # Create NEW keystore with known passwords
          keytool -genkey -v -keystore android/app/release.keystore -alias merge -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Merge Evolution PRO, OU=KesarmallInnovations, O=Kesarmall, L=Manesar, ST=Haryana, C=IN"
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore release.keystore
          ls -lh android/app/release.keystore
          # Create properties with KNOWN passwords
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=android123" >> android/app/keystore.properties
          echo "keyAlias=merge" >> android/app/keystore.properties
          echo "keyPassword=android123" >> android/app/keystore.properties
          echo "storeFile=app/release.keystore" > android/keystore.properties
          echo "storePassword=android123" >> android/keystore.properties
          echo "keyAlias=merge" >> android/keystore.properties
          echo "keyPassword=android123" >> android/keystore.properties

      - name: Build Signed AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: VERIFY Signing
        run: |
          cd android
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab && echo "✅ SIGNED VERIFIED!" || (echo "❌ STILL UNSIGNED" && exit 1)

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
