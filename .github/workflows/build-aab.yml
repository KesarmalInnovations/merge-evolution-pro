name: Build Final PRO AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Game
        run: |
          cat > package.json << 'EOF'
          {"name":"merge-pro","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/android":"^6.2.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {"appId":"com.mergeevolution.dragonspro","appName":"Merge Evolution PRO","webDir":"www","bundledWebRuntime":false}
          EOF
          mkdir -p www
          echo '<html><body style="background:#0a0a0a;color:#00ff88;text-align:center;padding:60px;font-family:sans-serif"><h1>Merge Evolution PRO</h1><h2>FINAL BUILD - API 35</h2></body></html>' > www/index.html
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build AAB
        run: |
          npm install
          npx cap add android
          npx cap sync android
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          cd android
          keytool -genkey -v -keystore app/release.keystore -alias mergeevolution -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Merge, OU=Game, O=Kesarmal, L=Delhi, S=Delhi, C=IN"
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("app/build.gradle")
          s=p.read_text()
          if "signingConfigs" not in s:
              s=s.replace("buildTypes {", 'signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "123456"\n            keyAlias "mergeevolution"\n            keyPassword "123456"\n        }\n    }\n    buildTypes {')
          s=s.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew bundleRelease
          ls -lh app/build/outputs/bundle/release/
      - uses: actions/upload-artifact@v4
        with:
          name: MERGE-PRO-FINAL-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
