name: FINAL - KesarmalInnovations MergeEvolution - REAL GAME
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Game Config - LOCKED PACKAGE
        run: |
          echo "PACKAGE: com.kesarmalinnovations.mergeevolution - REAL GAME"
          cat > package.json << 'EOF'
          {"name":"merge-evolution-pro","version":"1.1.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/android":"^6.2.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.kesarmallinnovations.mergeevolution",
            "appName": "Merge Evolution PRO",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          ls -lh www/
          echo "Using REAL game from www/index.html"
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build AAB - API 35 + Locked Keystore
        run: |
          npm install
          npx cap add android
          npx cap sync android
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          sed -i 's/versionCode .*/versionCode 2/' android/app/build.gradle || true
          sed -i 's/versionName .*/versionName "1.1"/' android/app/build.gradle || true
          cd android
          keytool -genkey -v -keystore app/release.keystore -alias kesarmal -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=KesarmalInnovations, OU=Games, O=KesarmalInnovations, L=Delhi, S=Delhi, C=IN"
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("app/build.gradle")
          s=p.read_text()
          if "signingConfigs" not in s:
              s=s.replace("buildTypes {", 'signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "123456"\n            keyAlias "kesarmal"\n            keyPassword "123456"\n        }\n    }\n    buildTypes {')
          s=s.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FINAL-REAL-GAME-AAB-v1.1
          path: android/app/build/outputs/bundle/release/app-release.aab
