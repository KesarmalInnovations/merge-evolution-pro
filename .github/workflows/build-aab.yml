name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "Using www"

      - name: Recreate Android Fresh
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: FORCE minSdk 24
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
          cat android/variables.gradle

      - name: Setup Keystore From Repo
        run: |
          echo "Using your committed release.keystore"
          ls -lh release.keystore
          cp release.keystore android/app/release.keystore
          cp release.keystore android/release.keystore
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties
          echo "storeFile=app/release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

      - name: Build Signed AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: VERIFY - Is AAB Signed or Not?
        run: |
          cd android
          echo "=== Checking if AAB is signed ==="
          if unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q "META-INF"; then
            echo "✅ META-INF found — checking signature..."
            unzip -l app/build/outputs/bundle/release/app-release.aab | grep META-INF
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab || (echo "❌ NOT SIGNED!" && exit 1)
          else
            echo "❌ NO META-INF — AAB IS UNSIGNED! Passwords are wrong!"
            exit 1
          fi

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
