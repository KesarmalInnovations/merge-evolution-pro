name: FINAL V11.13 - AD_ID REAL FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install
      - run: if [ ! -d "android" ]; then npx cap add android; fi

      - name: Setup SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create keystore.properties
        run: |
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Patch + Sync + AD_ID FIX
        run: |
          python3 << 'PY'
          import pathlib, re
          bg = pathlib.Path("android/app/build.gradle")
          t = bg.read_text()
          t = re.sub(r'versionCode\s+\d+', 'versionCode 16', t)
          t = re.sub(r'versionName\s+".*?"', 'versionName "1.0.16"', t)
          bg.write_text(t)
          v = pathlib.Path("android/variables.gradle")
          if v.exists():
              vt = v.read_text()
              vt = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', vt)
              vt = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', vt)
              v.write_text(vt)
          PY
          npx cap sync android
          python3 << 'PY'
          import pathlib
          mpath = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = mpath.read_text()
          if "AD_ID" not in txt:
              txt = txt.replace("</manifest>", '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n</manifest>')
              mpath.write_text(txt)
          print("MANIFEST AFTER FIX:")
          print(mpath.read_text()[-500:])
          PY
          cat android/app/src/main/AndroidManifest.xml | grep -i AD_ID || echo "AD_ID NOT FOUND - FAILED"

      - name: Build AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V16-ADID-FIXED
          path: android/app/build/outputs/bundle/release/app-release.aab
