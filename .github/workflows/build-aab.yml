name: FINAL V11.12 - ADS FIXED + API36

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Setup SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create keystore.properties
        run: |
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Patch + Sync
        run: |
          python3 << 'PY'
          import pathlib, re
          bg = pathlib.Path("android/app/build.gradle")
          t = bg.read_text()
          t = re.sub(r'versionCode\s+\d+', 'versionCode 15', t)
          t = re.sub(r'versionName\s+".*?"', 'versionName "1.0.15"', t)
          if "keystorePropertiesFile" not in t:
              t = t.replace("android {", 'def keystorePropertiesFile = rootProject.file("app/keystore.properties")\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {', 1)
          if "signingConfigs" not in t:
              t = t.replace("android {", 'android {\n    signingConfigs {\n        release {\n            storeFile file(keystoreProperties[\'storeFile\'] ?: \'release.keystore\')\n            storePassword keystoreProperties[\'storePassword\']\n            keyAlias keystoreProperties[\'keyAlias\']\n            keyPassword keystoreProperties[\'keyPassword\']\n        }\n    }', 1)
          if "signingConfig signingConfigs.release" not in t:
              t = re.sub(r'buildTypes\s*{\s*\n?\s*release\s*{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release', t, count=1)
          bg.write_text(t)
          v = pathlib.Path("android/variables.gradle")
          if v.exists():
              vt = v.read_text()
              vt = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', vt)
              vt = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', vt)
              v.write_text(vt)
          PY
          npx cap sync android
          # AD_ID AFTER sync - yehi main fix hai
          python3 << 'PY'
          import pathlib
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          mt = m.read_text()
          if "AD_ID" not in mt:
              mt = mt.replace("<application", '<uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <application')
              m.write_text(mt)
              print("AD_ID added AFTER sync - FIXED")
          PY

      - name: Build SIGNED AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-ADS-API36-V15-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
