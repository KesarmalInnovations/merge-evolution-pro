name: Build Merge Evolution PRO AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Game
        run: |
          cat > package.json << 'EOF'
          {"name":"merge-evolution-pro","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/android":"^6.2.0"}}
          EOF
          cat > capacitor.config.json << 'EOF'
          {"appId":"com.mergeevolution.dragons","appName":"Merge Evolution PRO","webDir":"www","bundledWebRuntime":false}
          EOF
          mkdir -p www
          echo '<html><body style="background:#111;color:#0f8;text-align:center;padding:50px;font-family:sans-serif"><h1>🐉 Merge Evolution PRO</h1><p>API 35 Final FIX ✅</p></body></html>' > www/index.html
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build AAB
        run: |
          npm install
          npx cap add android
          npx cap sync android
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          # Force 35
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          # Generate keystore
          cd android
          keytool -genkey -v -keystore app/release.keystore -alias mergeevolution -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Merge, OU=Game, O=Kesarmal, L=Delhi, S=Delhi, C=IN"
          # Correctly patch build.gradle using Python (no duplicate android block)
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("app/build.gradle")
          s = p.read_text()
          # Add signingConfigs before buildTypes
          if "signingConfigs" not in s:
              s = s.replace("buildTypes {", 'signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "123456"\n            keyAlias "mergeevolution"\n            keyPassword "123456"\n        }\n    }\n    buildTypes {')
          # Add signingConfig line inside release
          s = s.replace("minifyEnabled false", "minifyEnabled false\n            signingConfig signingConfigs.release")
          p.write_text(s)
          print(s[:1500])
          PY
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: merge-evolution-pro-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
