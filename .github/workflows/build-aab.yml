name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fix Keystore & Recreate Android if gradlew missing
        run: |
          ls -la
          echo "--- android folder ---"
          ls -la android || echo "no android folder"
          
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            cp release.keystore android/app/upload-keystore.jks || true
            cp release.keystore android/app/release.keystore || true
          fi
          
          # gradlew missing hai toh naya android banao
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew missing - recreating android platform..."
            rm -rf android
            if [ ! -f "package.json" ]; then
              npm init -y
              npm install @capacitor/core @capacitor/cli @capacitor/android
              npx cap init "Merge Evolution PRO" com.kesarmallinnovations.mergeevolutionpro --web-dir=www
            else
              npm install
            fi
            npx cap add android
            npx cap copy android || true
            # keystore wapas copy
            mkdir -p android/app
            cp release.keystore android/app/upload-keystore.jks || true
          fi
          
          ls -la android/
          chmod +x android/gradlew || true

      - name: Build AAB V8
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -x test

      - name: Find AAB
        run: find . -name "*.aab" -type f

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8
          path: |
            **/*.aab
            android/app/build/outputs/bundle/release/*.aab
