name: Build Merge Evolution PRO AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Game Files (NO ZIP NEEDED)
        run: |
          echo "Creating files from scratch..."
          
          cat > package.json << 'EOF'
          {
            "name": "merge-evolution-pro",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^5.7.0",
              "@capacitor/cli": "^5.7.0",
              "@capacitor/android": "^5.7.0"
            }
          }
          EOF
          
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.mergeevolution.dragons",
            "appName": "Merge Evolution PRO",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Evolution PRO</title><style>body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}h1{color:#00ff88}.box{background:#1a1a1a;padding:30px;border-radius:15px;text-align:center}</style></head><body><div class="box"><h1>🐉 Merge Evolution PRO</h1><p>Game Loading...</p><p style="color:#888;font-size:12px">Build Successful ✅</p></div><script>console.log("Game Ready");</script></body></html>
          EOF
          
          cat package.json
          ls -la www/

      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Build AAB
        run: |
          npm install
          npx cap add android || true
          npx cap sync android
          keytool -genkey -v -keystore android/app/release.keystore -alias mergeevolution -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Merge Evolution PRO, OU=Game Studio, O=Kesarmal Innovations, L=Delhi, S=Delhi, C=IN"
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=mergeevolution" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> android/gradle.properties
          cd android && chmod +x gradlew && ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: merge-evolution-pro-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
