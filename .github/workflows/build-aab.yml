name: FINAL V11.7 - API 36 - Android 15 - SIGNED

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Setup SDK 36 - Android 15
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "platforms;android-34"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create keystore.properties
        run: |
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Patch to API 36 + Version 13 + Signing
        run: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle").read_text()

          # 1. compileSdk & targetSdk 36
          p = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', p)
          p = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', p)
          p = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', p)
          p = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', p)
          p = re.sub(r'buildToolsVersion\s+".*?"', 'buildToolsVersion "36.0.0"', p)

          # 2. versionCode 13 (12 already used hai)
          p = re.sub(r'versionCode\s+\d+', 'versionCode 13', p)
          p = re.sub(r'versionName\s+".*?"', 'versionName "1.0.13"', p)

          # 3. signing inject
          if "signingConfigs" not in p:
              p = p.replace("android {", """
          def keystorePropertiesFile = rootProject.file("app/keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'] ?: 'release.keystore')
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          """, 1)
              p = p.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release")

          pathlib.Path("android/app/build.gradle").write_text(p)
          print("Patched to API 36 + version 13")
          PY

          # variables.gradle mein bhi API 36
          vpath = pathlib.Path("android/variables.gradle")
          if vpath.exists():
              vp = vpath.read_text()
              vp = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', vp)
              vp = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', vp)
              vp = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 22', vp)
              vpath.write_text(vp)

      - run: npx cap sync android

      - name: Build SIGNED AAB - API 36
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-API36-V13-PRODUCTION
          path: android/app/build/outputs/bundle/release/app-release.aab
