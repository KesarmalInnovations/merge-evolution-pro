name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "Using www folder"

      - name: Add Android
        run: npx cap add android || true

      - name: Copy web to Android
        run: npx cap copy android

      - name: FORCE minSdk 24 and AD_ID
        run: |
          echo "=== BEFORE ==="
          cat android/variables.gradle || true
          # Force create variables.gradle with minSdk 24
          mkdir -p android
          cat > android/variables.gradle << 'EOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxAppCompatVersion = '1.6.1'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              junitVersion = '4.13.2'
              androidxMaterialVersion = '1.11.0'
              androidxBrowserVersion = '1.8.0'
              androidxExifInterfaceVersion = '1.3.6'
              coreSplashScreenVersion = '1.0.1'
          }
          EOF
          echo "=== AFTER ==="
          cat android/variables.gradle
          # Also fix manifest for AD_ID
          chmod +x ./fix-ad-id.sh || true
          ./fix-ad-id.sh || true
          grep -q "AD_ID" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' android/app/src/main/AndroidManifest.xml

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "storeFile=release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
