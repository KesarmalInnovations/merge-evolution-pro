name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Restore if package.json missing
        run: |
          ls -la
          if [ ! -f "package.json" ]; then
            GOOD=$(git log --all --pretty=format:%H -- package.json | head -1)
            echo "Restoring from $GOOD"
            cp .github/workflows/build-aab.yml /tmp/b.yml
            git checkout $GOOD -- .
            cp /tmp/b.yml .github/workflows/build-aab.yml
          fi
          ls -la

      - name: Fix Capacitor Config
        run: |
          cat capacitor.config.json 2>/dev/null || echo "config.json missing"
          cat capacitor.config.ts 2>/dev/null || echo "config.ts missing"
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Merge Evolution PRO" com.kesarmallinnovations.mergeevolutionpro --web-dir=www
          fi
          # Force appId fix
          if [ -f "capacitor.config.json" ]; then
            node -e "let fs=require('fs'); let f='capacitor.config.json'; let j=JSON.parse(fs.readFileSync(f)); j.appId=j.appId||'com.kesarmallinnovations.mergeevolutionpro'; j.appName=j.appName||'Merge Evolution PRO'; j.webDir=j.webDir||'www'; fs.writeFileSync(f, JSON.stringify(j,null,2)); console.log(j)"
          fi
          cat capacitor.config.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Signed AAB
        run: |
          rm -rf android
          npm install
          npx cap add android
          npx cap copy android
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          cp android/key.properties android/app/key.properties
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload SIGNED AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-SIGNED-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
