name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-Heal Missing Files
        run: |
          git fetch --all --prune
          if [ ! -f package.json ]; then
            for C in $(git log --all --pretty=format:%H -- package.json); do
              if git cat-file -e $C:package.json 2>/dev/null; then
                git show $C:package.json > package.json
                git show $C:capacitor.config.json > capacitor.config.json 2>/dev/null || true
                git checkout $C -- src www 2>/dev/null || true
                break
              fi
            done
          fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Signed AAB
        run: |
          npm install
          npm install -D typescript
          rm -f capacitor.config.ts
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Merge Evolution PRO" com.kesarmalinnovations.mergeevolutionpro --web-dir=www --npm-client npm
          fi
          node -e "let fs=require('fs');let j=JSON.parse(fs.readFileSync('capacitor.config.json'));j.appId='com.kesarmalinnovations.mergeevolutionpro';j.appName='Merge Evolution PRO';j.webDir='www';fs.writeFileSync('capacitor.config.json',JSON.stringify(j,null,2))"
          rm -rf android
          npx cap add android
          npx cap copy android
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          cp android/key.properties android/app/key.properties
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-SIGNED-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
