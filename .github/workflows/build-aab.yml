name: Build Signed AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build AAB
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          npm ci || npm install
          npm run build || true
          rm -rf android
          npx cap add android
          npx cap copy android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          NEW_CODE=$(date +%s)
          echo "Version $NEW_CODE"
          sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/" android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "1.0.'$NEW_CODE'"/' android/app/build.gradle
          ls -lh release.keystore
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease
          cd ..
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass $STORE_PASS -keypass $KEY_PASS android/app/build/outputs/bundle/release/app-release.aab $KEY_ALIAS
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-AAB
          path: android/app/build/outputs/bundle/release/*.aab
