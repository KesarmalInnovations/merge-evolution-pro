name: FINAL V11.6 - SIGNED - Version 12

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Setup SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Create keystore.properties
        run: |
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties

      - name: Bump versionCode + Inject signing
        run: |
          python3 << 'PY'
          import pathlib, re
          path = pathlib.Path("android/app/build.gradle")
          p = path.read_text()

          # 1. versionCode 12 set karo (agar 12 already used bole toh 13 kar dena)
          p = re.sub(r'versionCode\s+\d+', 'versionCode 12', p)
          # 2. versionName bhi 1.0.12 kar do
          p = re.sub(r'versionName\s+".*?"', 'versionName "1.0.12"', p)

          # 3. signing inject
          if "signingConfigs" not in p:
              p = p.replace("android {", """
          def keystorePropertiesFile = rootProject.file("app/keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'] ?: 'release.keystore')
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          """, 1)
              p = p.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release")

          path.write_text(p)
          print("Patched versionCode 12 + signing")
          PY

      - run: npx cap sync android

      - name: Build SIGNED AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V12-PRODUCTION
          path: android/app/build/outputs/bundle/release/app-release.aab
