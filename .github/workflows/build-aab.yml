name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { java-version: 17, distribution: temurin }

      - name: Build + MANUAL SIGN with ORIGINAL KEY
        run: |
          npm ci || npm install
          npm run build || true
          rm -rf android
          npx cap add android
          npx cap copy android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          echo "=== Original keystore ==="
          ls -lh release.keystore
          # Build UNSIGNED first
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-build-cache --rerun-tasks || ./gradlew bundleRelease
          echo "=== Now signing manually with ORIGINAL key ==="
          AAB="app/build/outputs/bundle/release/app-release.aab"
          ls -lh $AAB
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.keystore -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} $AAB ${{ secrets.KEY_ALIAS }}
          echo "=== VERIFY ==="
          jarsigner -verify -verbose $AAB | head -20
          unzip -l $AAB | grep -E "BUNDLE.SF|META-INF/MANIFEST"
          echo "✅ SIGNED WITH ORIGINAL 66:C8... KEY"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-ORIGINAL-KEY-FINAL
          path: android/app/build/outputs/bundle/release/*.aab
