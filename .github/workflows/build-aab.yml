name: Build Signed AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install deps
        run: npm ci || npm install

      - name: Build web
        run: npm run build || echo "Using www folder"

      - name: Add Android Platform
        run: |
          rm -rf android || true
          npx cap add android
          npx cap copy android

      - name: FORCE minSdk 24 and AD_ID
        run: |
          echo "=== Fixing minSdk 24 ==="
          cat android/variables.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
          cat android/variables.gradle
          chmod +x ./fix-ad-id.sh || true
          ./fix-ad-id.sh || true
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            grep -q "AD_ID" android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Setup Keystore - FIXED FOR SIGNING
        run: |
          echo "Setting up keystore for signing..."
          # Check if secrets exist
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty! Go to GitHub -> Settings -> Secrets and add it"
            exit 1
          fi
          # Create keystore in BOTH locations
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore || true
          ls -lh android/app/release.keystore android/release.keystore
          # Create keystore.properties in BOTH locations with correct paths
          echo "storeFile=release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/keystore.properties
          # Also in root android folder for safety
          echo "storeFile=app/release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties
          echo "Keystore setup done:"
          ls -lh android/*.properties android/app/*.properties || true

      - name: Build Signed AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --info
          ls -lh app/build/outputs/bundle/release/

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SIGNED-AAB-V27-FINAL-MINSDK24-FIXED
          path: android/app/build/outputs/bundle/release/*.aab
