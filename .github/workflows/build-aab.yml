name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Restore if package.json missing
        run: |
          ls -la
          if [ ! -f "package.json" ]; then
            echo "package.json missing, restoring..."
            git checkout 3a024e8 -- package.json package-lock.json capacitor.config.json src public www 2>/dev/null || true
            # agar phir bhi na mile to history se last wala le lo
            if [ ! -f "package.json" ]; then
              LAST=$(git log --all --pretty=format:%H -- package.json | head -1)
              git checkout $LAST -- package.json package-lock.json 2>/dev/null || git checkout $LAST -- .
            fi
            ls -la
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Signed AAB
        run: |
          rm -rf android
          npm install
          npx cap add android
          npx cap copy android
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          cp android/key.properties android/app/key.properties
          sed -i "s/.*kotlin_version.*/    ext.kotlin_version = '1.8.22'/" android/build.gradle || true
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload SIGNED AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-SIGNED-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
