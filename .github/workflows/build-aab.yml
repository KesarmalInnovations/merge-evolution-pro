      - name: Build + MANUAL SIGN with ORIGINAL KEY
        run: |
          npm ci || npm install
          npm run build || true
          rm -rf android
          npx cap add android
          npx cap copy android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle || true
          
          # --- AUTO BUMP VERSION CODE ---
          NEW_CODE=$(date +%s)
          echo "Bumping versionCode to $NEW_CODE"
          sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/g" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.$NEW_CODE\"/g" android/app/build.gradle
          cat android/app/build.gradle | grep -E "versionCode|versionName"
          
          ls -lh release.keystore
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-build-cache --rerun-tasks || ./gradlew bundleRelease
          AAB="app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.keystore -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} $AAB ${{ secrets.KEY_ALIAS }}
          jarsigner -verify $AAB
