name: Build AAB API 36 Signed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm install -g cordova

      - name: Build Signed AAB API 36
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cordova create app com.kesarmal.mergeevolutionpro "Merge Evolution PRO"
          cp -r www/* app/www/
          cp release.keystore app/
          cd app
          cat > build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "$STORE_PASS",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASS"
              }
            }
          }
          EOF
          cordova platform add android@13.0.0
          sed -i 's/compileSdkVersion.*/    compileSdkVersion 36/' platforms/android/app/build.gradle
          sed -i 's/targetSdkVersion.*/    targetSdkVersion 36/' platforms/android/app/build.gradle
          sed -i 's/compileSdk 34/compileSdk 36/g; s/compileSdk 35/compileSdk 36/g' platforms/android/app/build.gradle
          sed -i 's/targetSdk 34/targetSdk 36/g; s/targetSdk 35/targetSdk 36/g' platforms/android/app/build.gradle
          sed -i 's/versionCode .*/versionCode 3/' platforms/android/app/build.gradle
          cordova build android --release --buildConfig=build.json -- --packageType=bundle

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-api36
          path: app/platforms/android/app/build/outputs/bundle/release/*.aab
