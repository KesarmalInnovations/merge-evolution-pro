name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-Heal Missing Files
        run: |
          git fetch --all --prune
          if [ ! -f package.json ]; then
            for C in $(git log --all --pretty=format:%H -- package.json); do
              if git cat-file -e $C:package.json 2>/dev/null; then
                git show $C:package.json > package.json
                git checkout $C -- src www 2>/dev/null || true
                break
              fi
            done
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Signed AAB API 36
        run: |
          npm install
          npm install -D typescript @capacitor/cli
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.kesarmalinnovations.mergeevolutionpro",
            "appName": "Merge Evolution PRO",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON
          rm -rf android
          npx cap add android
          npx cap copy android
          
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true
          sed -i "s/gradle-.*-all.zip/gradle-8.9-all.zip/" android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s/compileSdkVersion.*/compileSdkVersion = 36/" android/variables.gradle || true
          sed -i "s/targetSdkVersion.*/targetSdkVersion = 36/" android/variables.gradle || true
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          
          # --- SIGNING FIX ---
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties
          
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/app/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/app/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/app/key.properties
          echo "storeFile=upload-keystore.jks" >> android/app/key.properties
          
          # Patch build.gradle to actually use key.properties
          node <<'NODE'
          const fs=require('fs');
          let p='android/app/build.gradle';
          let c=fs.readFileSync(p,'utf8');
          if(!c.includes('keystoreProperties')){
            c=`def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          `+c;
          }
          c=c.replace(/signingConfigs\s*\{[\s\S]*?\n\s*\}\s*\n\s*buildTypes/s, `signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes`);
          if(!c.includes('signingConfig signingConfigs.release')){
            c=c.replace(/buildTypes\s*\{\s*release\s*\{/, 'buildTypes {\n        release {\n            signingConfig signingConfigs.release');
          }
          fs.writeFileSync(p,c);
          NODE
          
          chmod +x android/gradlew
          cd android
          ./gradlew clean bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-API36-SIGNED-FINAL
          path: android/app/build/outputs/bundle/release/app-release.aab
