name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Project + Fix gradlew Missing
        run: |
          ls -la
          echo "--- Fixing gradlew ---"
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew missing - recreating..."
            rm -rf android
            if [ ! -f "package.json" ]; then
              npm init -y
              npm install @capacitor/core @capacitor/cli @capacitor/android
              npx cap init "Merge Evolution PRO" com.kesarmalinnovations.mergeevolutionpro --web-dir=www
            else
              npm install
            fi
            npx cap add android
          fi
          
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            cp release.keystore android/app/upload-keystore.jks || true
          fi
          
          ls -la android/
          chmod +x android/gradlew
          
          # Kotlin Duplicate Fix
          if [ -f "android/build.gradle" ]; then
            sed -i "s/.*kotlin_version.*/    ext.kotlin_version = '1.8.22'/" android/build.gradle || true
          fi
          for f in android/build.gradle android/app/build.gradle; do
            if [ -f "$f" ] && ! grep -q "resolutionStrategy" "$f"; then
              echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> "$f"
            fi
          done

      - name: Build AAB V8
        run: |
          cd android
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8
          path: |
            **/*.aab
