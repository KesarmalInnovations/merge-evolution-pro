name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup + Fix gradlew + Kotlin Duplicate
        run: |
          # Keystore
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            cp release.keystore android/app/upload-keystore.jks || true
          fi
          
          # gradlew missing hai toh recreate
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Merge Evolution PRO" com.kesarmalinnovations.mergeevolutionpro --web-dir=www
            npx cap add android
            mkdir -p android/app
            cp release.keystore android/app/upload-keystore.jks || true
          fi
          
          chmod +x android/gradlew
          
          # --- KOTLIN DUPLICATE FIX ---
          echo "Fixing kotlin duplicate..."
          sed -i "s/.*kotlin_version.*/    ext.kotlin_version = '1.8.22'/" android/build.gradle || true
          
          for f in android/build.gradle android/app/build.gradle; do
            if [ -f "$f" ]; then
              # purana fix hatao
              sed -i "/resolutionStrategy/d" "$f" || true
              sed -i "/force.*kotlin/d" "$f" || true
              # naya fix add karo
              echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          configurations.implementation {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }" >> "$f"
            fi
          done
          
          rm -rf ~/.gradle/caches || true

      - name: Build AAB V8
        run: |
          cd android
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8
          path: |
            **/*.aab
