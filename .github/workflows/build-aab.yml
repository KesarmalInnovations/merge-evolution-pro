name: Merge Evolution PRO - V8 Closed Testing API 36
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build AAB
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            cp release.keystore android/app/upload-keystore.jks
          fi
          
          # Check project type
          ls -la
          echo "--- www folder ---"
          ls -la www || echo "no www"
          
          if [ -f "package.json" ]; then
            npm install
            npx cap add android || true
            npx cap copy
            npx cap sync
            cd android
            chmod +x gradlew
            ./gradlew bundleRelease --build-cache
          elif [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build appbundle --release --build-number=8 --build-name=1.0.2
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v8
          path: |
            **/*.aab
            android/app/build/outputs/**/*.aab
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
