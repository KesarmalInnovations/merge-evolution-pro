name: Restore Project Files
on: workflow_dispatch
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore via direct download
        run: |
          git config user.name "Kesarmall"
          git config user.email "fix@mobile.com"
          curl -L -o package.json https://raw.githubusercontent.com/KesarmallInnovations/merge-evolution-pro/3a024e8/package.json
          curl -L -o capacitor.config.json https://raw.githubusercontent.com/KesarmallInnovations/merge-evolution-pro/3a024e8/capacitor.config.json || true
          curl -L -o package-lock.json https://raw.githubusercontent.com/KesarmallInnovations/merge-evolution-pro/3a024e8/package-lock.json || true
          ls -la
          cat package.json | head -20
          git add package.json capacitor.config.json package-lock.json
          git commit -m "Restore files via curl from 3a024e8"
          git push
